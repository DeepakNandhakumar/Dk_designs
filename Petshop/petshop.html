<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Petshop</title>
        <link href='https://fonts.googleapis.com/css?family=Dancing Script' rel='stylesheet'>
        <style>

        body{
            font-family: 'Dancing Script';
            display: flex;
            height: 100vh;
            width: 100%;
            margin: 0;

        }
        header{
            font-size: large;
            height: 100px;
            width: 100%;
            background-color: rgb(151, 247, 247);
            box-shadow: 0 4px 6px rgb(147, 17, 123);
            background: linear-gradient(to right, rgb(255, 160, 152),rgb(65, 116, 235));
            
        }
        h1{
            font-style: oblique;
            margin-left: 20px;
        }
        .bx{
            box-sizing: border-box;
            background-color: #f5f1f4;
            border: 3px solid rgb(241, 214, 231);
            border-radius: 30px;
            display: flex;
            height: 900px;
            width: 900px;
            margin-left: -1200px;
            margin-top: 130px;
        }
        img{
            border-radius: 30px;
            padding: 3px;
        }
        </style>
    </head>
    <body>
        <header>
            <h1>Chewy Pet Shop</h1>
        </header>
        <div class="bx">
        <img height="180px" width="300px" src="https://e1.pxfuel.com/desktop-wallpaper/379/113/desktop-wallpaper-cute-puppy-on-dog-dog-laptop.jpg" >
        <img height="300px" width="280px" src="https://hips.hearstapps.com/hmg-prod/images/cute-cat-photos-1593441022.jpg?crop=0.670xw:1.00xh;0.167xw,0&resize=640:*" >
        <img height="180px" width="300px" src="https://i.pinimg.com/736x/9e/4b/96/9e4b962ee80afeed2add31810a3d51b4.jpg" >
    </div>
    </body>
</html>
