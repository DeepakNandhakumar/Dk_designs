<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,Helvetica,sans-serif;
  background:#111827;
}
.calculator{
  width:min(92vw,360px);
  background:#1f2937;
  padding:20px;
  border-radius:18px;
  box-shadow:0 18px 45px rgba(0,0,0,.35);
}
#display{
  width:100%;
  height:78px;
  border:0;
  outline:0;
  border-radius:12px;
  margin-bottom:16px;
  padding:0 16px;
  font-size:32px;
  text-align:right;
  background:#f9fafb;
  color:#111827;
}
.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
button{
  height:58px;
  border:0;
  border-radius:12px;
  font-size:20px;
  cursor:pointer;
  background:#374151;
  color:#fff;
}
button:hover{filter:brightness(1.08)}
.operator{background:#2563eb}
.equal{background:#16a34a}
.clear{background:#dc2626}
</style>
</head>
<body>
<div class="calculator">
  <input id="display" type="text" value="0" readonly aria-label="Calculator display">
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="backspace()">⌫</button>
    <button class="operator" onclick="append('%')">%</button>
    <button class="operator" onclick="append('/')">÷</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="operator" onclick="append('*')">×</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="operator" onclick="append('-')">−</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="operator" onclick="append('+')">+</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button class="equal" style="grid-column:span 2" onclick="calculate()">=</button>
  </div>
</div>

<script>
const display = document.getElementById("display");

function append(value){
  if(display.value === "0" && /[0-9.]/.test(value)){
    display.value = value;
    return;
  }
  if(display.value === "Error"){
    display.value = value;
    return;
  }
  display.value += value;
}

function clearDisplay(){
  display.value = "0";
}

function backspace(){
  if(display.value === "Error" || display.value.length <= 1){
    display.value = "0";
    return;
  }
  display.value = display.value.slice(0,-1);
}

function calculate(){
  try{
    const expression = display.value.replace(/÷/g,"/").replace(/×/g,"*");
    if(!/^[0-9+\-*/%.()\s]+$/.test(expression)) throw new Error("Invalid expression");
    const result = Function("return (" + expression + ")")();
    if(!Number.isFinite(result)) throw new Error("Invalid result");
    display.value = String(result);
  }catch(error){
    display.value = "Error";
  }
}
</script>
</body>
</html>
