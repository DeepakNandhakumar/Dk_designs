<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Website</title>
    <link href='https://fonts.googleapis.com/css?family=Dancing Script' rel='stylesheet'>
    <style>
        body {
            font-family: 'Dancing Script', cursive;
            font-size: xx-large;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }
        header h1 {
            margin: 10px;
        }
        header button {
            font-size: medium;
            padding: 10px 20px;
            cursor: pointer;
            background-color: rgb(239, 219, 219);
            border-radius: 2px;
            
        }
        .content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .content .text {
            flex: 1;
            margin: 10px;
        }
        .content .image {
            flex: 1;
            text-align: right;
        }
        .content img {
            max-width: 100%;
            height: auto;
        }
        hr {
            margin: 20px 0;
        }
        .collection {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .collection a {
            text-align: center;
            text-decoration: none;
            color: black;
        }
        .collection img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .collection img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
